apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pixelpipe-worker
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_GITHUB_USER/YOUR_REPO.git
    targetRevision: main
    path: charts/service
    helm:
      releaseName: pixelpipe-worker
      valueFiles:
        - ../../gitops/envs/prod/values/worker.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: pixelpipe
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  # KEDA owns replica count.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
