[project]
name = "pixelpipe-api"
version = "1.0.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE", "SIM"]
ignore = ["B008"] # FastAPI's File(...)/Query(...) defaults are idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
