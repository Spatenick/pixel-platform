# Local development: the whole app on your laptop, no AWS account needed.
#   docker compose up --build
#   curl -F "file=@some-photo.jpg" http://localhost:8080/v1/images
#
# Moto plays the part of S3 + SQS. Postgres is real.

x-app-env: &app-env
  ENVIRONMENT: local
  AWS_REGION: eu-west-2
  AWS_DEFAULT_REGION: eu-west-2
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_ENDPOINT_URL: http://aws:5000
  S3_BUCKET: pixelpipe-local
  SQS_QUEUE_URL: http://aws:5000/123456789012/pixelpipe-local-jobs
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: pixelpipe
  DB_USER: pixelpipe
  DB_PASSWORD: pixelpipe
  DB_SSLMODE: disable
  LOG_LEVEL: INFO

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pixelpipe
      POSTGRES_PASSWORD: pixelpipe
      POSTGRES_DB: pixelpipe
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixelpipe"]
      interval: 2s
      timeout: 3s
      retries: 20

  aws:
    image: motoserver/moto:5.2.4
    ports: ["5000:5000"]

  aws-init:
    image: amazon/aws-cli:latest
    depends_on: [aws]
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: eu-west-2
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws --endpoint-url http://aws:5000 s3 ls >/dev/null 2>&1; do sleep 1; done
        aws --endpoint-url http://aws:5000 s3 mb s3://pixelpipe-local
        aws --endpoint-url http://aws:5000 sqs create-queue --queue-name pixelpipe-local-jobs
        echo "local AWS ready"

  api:
    build:
      context: ./apps/api
      args: { APP_VERSION: local }
    environment: *app-env
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      aws-init: { condition: service_completed_successfully }

  worker:
    build:
      context: ./apps/worker
      args: { APP_VERSION: local }
    environment: *app-env
    ports: ["9100:9100"]
    depends_on:
      postgres: { condition: service_healthy }
      aws-init: { condition: service_completed_successfully }
