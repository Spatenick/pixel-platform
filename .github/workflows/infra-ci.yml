name: infra-plan

# Every PR that touches infrastructure gets: fmt, validate, tflint, Checkov,
# and a real `terraform plan` per environment posted as a PR comment.

on:
  pull_request:
    paths: ["infra/**", ".tflint.hcl", ".checkov.yaml", ".github/workflows/infra-ci.yml"]
  workflow_dispatch:

concurrency:
  group: infra-plan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  static:
    name: fmt, validate, lint, security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "<1.15.0"
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff infra

      - name: terraform validate (every root module)
        run: |
          for dir in infra/bootstrap infra/envs/dev infra/envs/prod; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      - name: terraform test (mocked providers -- no AWS calls)
        run: |
          terraform -chdir=infra/modules/environment init -backend=false -input=false
          terraform -chdir=infra/modules/environment test

      - uses: terraform-linters/setup-tflint@v6
      - name: tflint
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --chdir infra
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids rate limits downloading the AWS ruleset

      - name: Checkov (IaC security scan)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          config_file: .checkov.yaml

  plan:
    name: plan (${{ matrix.environment }})
    needs: static
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
    defaults:
      run:
        working-directory: infra/envs/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "<1.15.0"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: terraform init
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${{ vars.AWS_REGION }}"

      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform plan -lock-timeout=5m -no-color -detailed-exitcode -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          [ "$code" -eq 1 ] && exit 1 || true
          terraform show -no-color tfplan > plan-full.txt
          grep -E '^(Plan:|No changes)' plan.txt | tail -1 > summary.txt || echo "see logs" > summary.txt

      - name: Cost estimate (optional, needs the INFRACOST_API_KEY secret)
        if: env.INFRACOST_API_KEY != ''
        run: |
          curl -fsSL https://raw.githubusercontent.com/infracost/infracost/master/scripts/install.sh | sh
          terraform show -json tfplan > plan.json
          infracost breakdown --path plan.json --format table --out-file cost.txt
          cat cost.txt

      - name: Comment plan on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          WORKDIR: infra/envs/${{ matrix.environment }}
        with:
          script: |
            const fs = require('fs');
            const dir = process.env.WORKDIR;
            const env = process.env.ENVIRONMENT;
            const read = (f) => fs.existsSync(`${dir}/${f}`) ? fs.readFileSync(`${dir}/${f}`, 'utf8') : '';
            const max = 60000;
            let plan = read('plan-full.txt');
            if (plan.length > max) plan = plan.slice(0, max) + '\n... truncated, see workflow logs';
            const cost = read('cost.txt');
            const marker = `<!-- terraform-plan-${env} -->`;
            const body = [
              marker,
              `### Terraform plan: \`${env}\``,
              `**${read('summary.txt').trim()}**`,
              cost ? `<details><summary>Cost estimate</summary>\n\n\`\`\`\n${cost}\n\`\`\`\n</details>` : '',
              `<details><summary>Full plan</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n</details>`,
              `_Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}_`,
            ].join('\n\n');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
