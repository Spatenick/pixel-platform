version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: pip
    directory: /apps/api
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"] }

  - package-ecosystem: pip
    directory: /apps/worker
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"] }

  - package-ecosystem: docker
    directories: ["/apps/api", "/apps/worker"]
    schedule: { interval: weekly }

  - package-ecosystem: terraform
    directories: ["/infra/bootstrap", "/infra/envs/dev", "/infra/envs/prod"]
    schedule: { interval: weekly }
