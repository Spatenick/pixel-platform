apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.clusterSecretStore.name }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.clusterSecretStore.region | quote }}
      # No auth block: the ESO controller authenticates with its own EKS Pod
      # Identity role, which can only read the secrets Terraform allowed.
